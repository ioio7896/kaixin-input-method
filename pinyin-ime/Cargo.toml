[package]
name = "pinyin-ime"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
license = "Apache-2.0"
readme = "../README.md"
description = "Local-first Chinese input method engine and tools for Windows"
repository = "https://github.com/ioio7896/kaixin-ime"

[lib]
name = "pinyin_ime"
path = "src/lib.rs"

[[bin]]
# 与库名 pinyin_ime 区分，避免 Windows 上 release 的 PDB 文件名冲突
name = "pinyin_ime_gui"
path = "src/main.rs"

[[bin]]
name = "thuocl_tool"
path = "src/bin/thuocl_tool.rs"

[[bin]]
name = "srf_ime_settings"
path = "src/bin/srf_ime_settings.rs"

[[bin]]
name = "srf_ime_tray"
path = "src/bin/srf_ime_tray.rs"

[[bin]]
name = "srf_ime_engine"
path = "src/bin/srf_ime_engine.rs"

[[bin]]
name = "srf_ime_clipboard"
path = "src/bin/srf_ime_clipboard.rs"

[[bin]]
name = "srf_ime_handwrite"
path = "src/bin/srf_ime_handwrite.rs"

[[bin]]
name = "srf_ime_ocr"
path = "src/bin/srf_ime_ocr.rs"

[[bin]]
name = "srf_ime_translate_result"
path = "src/bin/srf_ime_translate_result.rs"

[[bin]]
name = "bake_lexicon"
path = "src/bin/bake_lexicon.rs"

[[bin]]
name = "build_clean_lexicons"
path = "src/bin/build_clean_lexicons.rs"

[[bin]]
name = "input_smoke"
path = "src/bin/input_smoke.rs"

[[bin]]
name = "input_eval"
path = "src/bin/input_eval.rs"

[[bin]]
name = "input_perf"
path = "src/bin/input_perf.rs"

[[bin]]
name = "phrase_len_eval"
path = "src/bin/phrase_len_eval.rs"

[[bin]]
name = "build_blind_corpus"
path = "src/bin/build_blind_corpus.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = "0.29"
egui = "0.29"
encoding_rs = "0.8"
fontdb = "0.23"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
lru = "0.12"
memmap2 = "0.9"
pinyin = "0.10"
rfd = "0.15"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bincode = "1"

[build-dependencies]
pinyin = "0.10"
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Graphics_Capture", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
xcap = { version = "0.9.6", default-features = false, features = ["wgc"] }

[profile.release]
lto = true
codegen-units = 1
