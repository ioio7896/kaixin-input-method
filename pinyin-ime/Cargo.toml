[package]
name = "pinyin-ime"
version = "2026.1126.1123"
edition = "2021"
rust-version = "1.99"
build = "build.rs"
license = "Apache-2.0"
readme = "../README.md"
description = "Local-first Chinese input method engine and tools for Windows"
repository = "https://github.com/ioio7896/kaixin-input-method"

[features]
default = ["desktop"]
desktop = ["kaixin-core/desktop", "dep:eframe", "dep:egui", "dep:fontdb", "dep:raw-window-handle", "dep:rfd", "dep:xcap"]
dev-tools = []

[lib]
name = "pinyin_ime"
path = "src/facade.rs"

[[bin]]
# 与库名 pinyin_ime 区分，避免 Windows 上 release 的 PDB 文件名冲突
name = "pinyin_ime_gui"
required-features = ["desktop"]
path = "src/main.rs"

[[bin]]
name = "lexicon_tool"
path = "src/bin/thuocl_tool.rs"
required-features = ["dev-tools"]

[[bin]]
name = "srf_ime_desktop"
required-features = ["desktop"]
path = "src/bin/srf_ime_desktop.rs"

[[bin]]
name = "srf_ime_engine"
path = "src/bin/srf_ime_engine.rs"

[[bin]]
name = "srf_ime_clipboard_svc"
path = "src/bin/srf_ime_clipboard_svc.rs"

[[bin]]
name = "srf_ime_setup"
path = "src/bin/srf_ime_setup.rs"

[[bin]]
name = "bake_lexicon"
path = "src/bin/bake_lexicon.rs"
required-features = ["dev-tools"]

[[bin]]
name = "build_ai_lexicons"
path = "src/bin/build_clean_lexicons.rs"
required-features = ["dev-tools"]

[[bin]]
name = "input_smoke"
path = "src/bin/input_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "input_eval"
path = "src/bin/input_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "input_perf"
path = "src/bin/input_perf.rs"
required-features = ["dev-tools"]

[[bin]]
name = "phrase_len_eval"
path = "src/bin/phrase_len_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "learning_replay_eval"
path = "src/bin/learning_replay_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "build_blind_corpus"
path = "src/bin/build_blind_corpus.rs"
required-features = ["dev-tools"]

[dependencies]
kaixin-common = { workspace = true }
kaixin-core = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
encoding_rs = { workspace = true }
fontdb = { workspace = true, optional = true }
fs2 = { workspace = true }
image = { workspace = true }
lru = { workspace = true }
memmap2 = { workspace = true }
pinyin = { workspace = true }
rfd = { workspace = true, optional = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
bincode = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = { workspace = true }
raw-window-handle = { workspace = true, optional = true }
windows-sys = { workspace = true }
windows = { workspace = true }
xcap = { workspace = true, optional = true }
