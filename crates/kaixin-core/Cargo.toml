[package]
name = "kaixin-core"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
build = "../../pinyin-ime/build.rs"
[lib]
path = "../../pinyin-ime/src/lib.rs"
[features]
default = []
desktop = ["dep:egui", "dep:xcap"]
[dependencies]
kaixin-common = { path = "../kaixin-common" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = { version = "0.29", optional = true }
encoding_rs = "0.8"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
lru = "0.18.2"
memmap2 = "0.9.11"
pinyin = "0.10"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
flate2 = "1.1.9"

[build-dependencies]
pinyin = "0.10"
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Graphics_Capture", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
xcap = { optional = true, version = "0.9.6", default-features = false, features = ["wgc"] }
