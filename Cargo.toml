[workspace]
members = ["pinyin-ime", "crates/kaixin-common", "crates/kaixin-core", "crates/kaixin-release", "crates/kaixin-pinyin", "crates/kaixin-platform", "crates/kaixin-capture", "crates/kaixin-translate", "crates/kaixin-clipboard"]
resolver = "2"

[workspace.dependencies]
arc-swap = "1.7"
base64 = "0.22"
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-win = "5.4.1"
eframe = { version = "0.29" }
egui = { version = "0.29" }
embed-resource = "3"
encoding_rs = "0.8"
flate2 = "1.1.9"
fontdb = { version = "0.23" }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
im = { version = "15.1", features = ["serde"] }
kaixin-common = { path = "crates/kaixin-common" }
kaixin-core = { path = "crates/kaixin-core", default-features = false }
kaixin-pinyin = { path = "crates/kaixin-pinyin" }
kaixin-platform = { path = "crates/kaixin-platform" }
kaixin-capture = { path = "crates/kaixin-capture" }
kaixin-translate = { path = "crates/kaixin-translate" }
kaixin-clipboard = { path = "crates/kaixin-clipboard" }
lru = "0.18.2"
memmap2 = "0.9.11"
pinyin = "0.10"
raw-window-handle = { version = "0.6" }
regex = "1"
ring = "0.17.14"
rfd = { version = "0.15" }
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.62", features = ["Graphics_Capture", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
xcap = { version = "0.9.6", default-features = false, features = ["wgc"] }
zeroize = "1.9"

[profile.release]
lto = true
codegen-units = 1
