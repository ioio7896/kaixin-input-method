name: Public repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene and license records
        run: |
          python scripts/check_open_source_readiness.py --release
          python scripts/check_public_privacy.py
          python -m unittest discover -s scripts -p test_public_privacy.py
          python scripts/generate_shared_contracts.py --check
      - name: Check Python syntax
        run: python -m py_compile scripts/check_open_source_readiness.py scripts/check_public_privacy.py scripts/generate_shared_contracts.py scripts/lexicon_pack.py scripts/trim_package.py

  rust-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: pinyin-ime/Cargo.toml
          command: check
          arguments: ""
          command-arguments: licenses sources

  source-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check the source-only Rust build
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test shared contracts and the input core
        run: cargo test -p kaixin-common -p kaixin-core --lib --no-default-features --locked
