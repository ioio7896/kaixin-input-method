name: Public repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene and license records
        run: |
          python scripts/check_open_source_readiness.py --release
          python scripts/check_public_privacy.py
          python -m unittest discover -s scripts -p test_public_privacy.py
          python -m unittest discover -s scripts -p test_build_privacy.py
          python scripts/generate_shared_contracts.py --check
      - name: Check Python syntax
        run: python -m py_compile scripts/check_open_source_readiness.py scripts/check_public_privacy.py scripts/generate_shared_contracts.py scripts/lexicon_pack.py scripts/trim_package.py
      - name: Test OCR image planning, budgets, and model cache
        run: |
          python -m pip install numpy pillow opencv-python-headless
          python -m unittest discover -s scripts -p test_ocr_pipeline.py

  rust-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: pinyin-ime/Cargo.toml
          command: check
          arguments: ""
          command-arguments: licenses sources

  source-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify pinned release toolchain and versions
        run: |
          python scripts/check_release_toolchain.py
          python scripts/release_version.py --check
          python -m unittest discover -s scripts -p test_release_validation.py
          python -m unittest discover -s scripts -p test_input_benchmark_report.py
      - name: Install pinned source-check tools
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_dev_tools.ps1
      - name: Check source conventions
        run: python scripts/verify.py source
      - name: Check and test all Rust targets and feature profiles
        run: python scripts/verify.py rust

  native-tsf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test native targets
        run: python scripts/verify.py native
