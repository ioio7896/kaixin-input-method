name: 功能建议
description: 提议新的输入法功能或改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私、兼容性或授权影响
      description: 如果涉及联网、剪贴板、截图、第三方代码或数据，请明确说明。
    validations:
      required: true
