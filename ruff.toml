target-version = "py312"
line-length = 100
include = ["build.py", "scripts/**/*.py", "tools/*.py"]
exclude = ["dist", "third_party", "RapidOCRLite", "RapidOCR-3.9.0"]

[lint]
select = ["E4", "E7", "E9", "F"]
# Imports after sys.path setup are needed by standalone repository tools.
[lint.per-file-ignores]
"scripts/test_*.py" = ["E402"]
"tools/*.py" = ["E402"]
